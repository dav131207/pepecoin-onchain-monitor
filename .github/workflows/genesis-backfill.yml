name: Genesis Backfill

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pep-data-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run genesis backfill (time-boxed)
        run: timeout 5h python backfill_genesis.py || true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backfill_genesis_state.json large_transfers_3m.jsonl miner_rewards.jsonl
          git diff --cached --quiet || git commit -m "Genesis backfill progress $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Concurrency group already serializes this against weekly-monitor.yml,
          # but a manual/stray overlap could still race — retry a few times before
          # giving up, rather than silently losing a multi-hour local commit.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "::error::Could not push after 5 attempts — local commit is lost when this runner is torn down."
          exit 1
