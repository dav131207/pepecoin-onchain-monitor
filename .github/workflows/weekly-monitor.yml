name: Weekly Monitor

on:
  schedule:
    - cron: "59 21 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pep-data-pipeline
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Catch up recent 90-day window
        run: timeout 30m python backfill_history.py || true

      - name: Rank exchange candidates
        run: python rank_exchange_candidates.py || true

      - name: Weekly snapshot + price/OHLC update
        run: python monitor.py

      - name: Holder distribution (Gini, top-percentile shares)
        run: timeout 20m python holder_distribution.py || true

      - name: Whale dormancy
        run: python whale_dormancy.py || true

      - name: Address clustering (common-input heuristic)
        run: python address_clustering.py || true

      - name: Coin-age analysis (CDD, HODL waves)
        run: python coin_age_analysis.py || true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots known_whales.json exchange_candidates.json miner_wallets.json \
            large_transfers/ miner_rewards/ price_history.json price_ohlc.json \
            network_stats.json backfill_state.json last_scanned_block.txt \
            holder_distribution.json whale_dormancy.json address_clusters.json \
            coin_days_destroyed.json hodl_waves.json
          git diff --cached --quiet || git commit -m "Weekly monitor run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Concurrency group already serializes this against genesis-backfill.yml,
          # but a manual/stray overlap could still race — retry a few times before
          # giving up, rather than silently losing this run's results.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "::error::Could not push after 5 attempts — local commit is lost when this runner is torn down."
          exit 1
