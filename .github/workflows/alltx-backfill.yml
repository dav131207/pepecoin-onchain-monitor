name: All-Transactions Backfill

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pep-data-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run all-transactions backfill (time-boxed)
        run: timeout 5h python backfill_alltx.py || true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in backfill_alltx_state.json all_transactions/; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "All-tx backfill progress $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "::error::Could not push after 5 attempts — local commit is lost when this runner is torn down."
          exit 1
