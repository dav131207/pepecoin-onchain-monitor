name: All-Transactions Backfill

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Eigene Concurrency-Gruppe (nicht die geteilte pep-data-pipeline): dieser Lauf
# schreibt ausschließlich in utxo_index/ + die vier Reduktions-Dateien +
# backfill_alltx_state.json — keine Überschneidung mit genesis-backfill/weekly-monitor
# (large_transfers/, miner_rewards/, snapshots/ ...). In der geteilten Gruppe wurde
# jeder 5h-Lauf reihum abgebrochen, bevor er committen konnte — 10 Tage ohne ein
# einziges Ergebnis. Push-Konflikte auf main fängt die Retry-Schleife unten ab
# (disjunkte Dateien -> sauberer Rebase).
concurrency:
  group: alltx-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Record starting commit
        # Referenz für den Warn-Check im letzten Step: backfill_alltx.py pusht jetzt
        # selbst periodisch (siehe PUSH_MIN_INTERVAL_MINUTES in backfill_alltx.py) —
        # "am Ende nichts mehr zu committen" heißt seitdem oft "lief gut, schon
        # zwischendurch gepusht", nicht mehr automatisch "Stillstand".
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run all-transactions backfill (time-boxed)
        # 320m statt 260m: ohne eigenes SIGTERM-Handling (entfernt, siehe backfill_alltx.py)
        # braucht der Prozess selbst keinen Shutdown-Puffer mehr — `timeout` beendet ihn
        # sofort. Die verbleibenden ~30 Min bis zum Job-Timeout (350) reichen für
        # Commit/Push samt Retry-Schleife. `timeout` akzeptiert nur ein einzelnes Suffix
        # — "4h20m"/"5h20m" wären ungültig und würden sofort abbrechen.
        # PYTHONUNBUFFERED: ohne das puffert Python stdout in einer Pipe komplett (kein
        # Zeilen-Flush) — beim 48-Worker-Testlauf am 11.09. stand deshalb eine volle
        # Stunde lang GAR KEINE Ausgabe im Log, obwohl (vermutlich) längst etwas schiefging.
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 320m python backfill_alltx.py || true

      - name: Commit and push results
        # if: always() — MUSS auch bei Cancel/Timeout des Backfill-Steps laufen, sonst
        # geht der komplette (evtl. mehrstündige) Zwischenstand verloren, wenn der Lauf
        # nicht exakt sauber durchläuft. Genau daran scheiterten bisher alle Läufe.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in backfill_alltx_state.json utxo_index/ address_clusters_state.json \
            address_clusters.json coin_days_destroyed.json hodl_waves.json \
            fee_stats.json alltx_orphan_spends.json blocks_incomplete_alltx.txt; do
            [ -e "$f" ] && git add "$f"
          done
          # ::warning:: statt stillem No-Op: ein Lauf, der 5+ Stunden läuft und NICHTS
          # committet, sah bisher identisch zu einem gesunden Lauf aus ("success", kein
          # Fehler) — genau das verschleierte den 27 Tage dauernden Stillstand bis zum
          # 08.10.2026. Jetzt taucht ein stiller Lauf sofort als Warnung im Actions-Tab auf.
          #
          # ABER: seit backfill_alltx.py selbst periodisch pusht (git_push() im Skript,
          # siehe PUSH_MIN_INTERVAL_MINUTES), ist "hier nichts mehr zu committen" bei
          # einem GUT laufenden Lauf der Normalfall, nicht die Ausnahme — der Fortschritt
          # ist dann schon während des Laufs rausgegangen. Nur wenn ZUSÄTZLICH HEAD
          # gegenüber dem Checkout-Zeitpunkt (START_SHA) unverändert ist, gab es in
          # diesem gesamten Lauf WIRKLICH keinen einzigen Push — das ist der echte
          # Stillstandsfall.
          if git diff --cached --quiet; then
            if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
              echo "::warning::Dieser Lauf hat KEINEN Fortschritt committet (next_height unverändert) — Backfill könnte feststecken, siehe Log des vorherigen Steps."
            else
              echo "Kein zusätzlicher Commit nötig — backfill_alltx.py hat den Fortschritt schon während des Laufs selbst gepusht."
            fi
          else
            git commit -m "All-tx backfill progress $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "::error::Could not push after 5 attempts — local commit is lost when this runner is torn down."
          exit 1
