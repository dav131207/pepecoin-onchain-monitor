name: Mempool Snapshot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Eigene Gruppe (nicht pep-data-pipeline): Mempool ist nicht rückwirkend
# erfassbar, ein stündlicher Snapshot darf nie hinter einem 5h-Backfill
# verhungern. Schreibt in eigene Dateien (mempool_history/), daher kein
# Konfliktrisiko mit den anderen Workflows.
concurrency:
  group: mempool-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Take mempool snapshot
        run: python mempool_snapshot.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mempool_history/
          git diff --cached --quiet || git commit -m "Mempool snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
